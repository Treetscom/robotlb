repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: fmt
        types:
          - rust
        name: cargo fmt
        language: system
        entry: cargo
        pass_filenames: false
        args:
          - fmt
          - --all

      - id: clippy
        types:
          - rust
        name: cargo clippy
        language: system
        pass_filenames: false
        entry: cargo
        args:
          - clippy
          - --all

      - id: test
        types:
          - rust
        name: cargo test
        language: system
        pass_filenames: false
        entry: cargo
        args:
          - test
          - --all

      - id: check
        types:
          - rust
        name: cargo check
        language: system
        entry: cargo
        pass_filenames: false
        args:
          - build
