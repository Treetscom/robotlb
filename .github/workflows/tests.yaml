name: "Testing package"

on: pull_request

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - uses: pre-commit/action@v3.0.1
      - name: Run Rust unit tests
        run: cargo test --all-targets --locked

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build locked release image
        run: docker buildx build --platform linux/amd64 --load --progress=plain -t robotlb:pr .
      - name: Verify runtime dependencies and CLI startup
        run: |
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh robotlb:pr -c '
            ldd /usr/local/bin/robotlb
            /usr/local/bin/robotlb --help > /dev/null
          '

  helm-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git
      - name: Run Helm unittests
        run: helm unittest helm
