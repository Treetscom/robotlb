[package]
name = "robotlb"
version = "0.7.6"
edition = "2024"
readme = "README.md"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.21", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.31"
hcloud = "0.26.0"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
kube = { version = "4.0.0", features = ["runtime"] }
kube-leader-election = "0.44.0"
thiserror = "2.0.3"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["trace", "grpc-tonic"] }
opentelemetry-semantic-conventions = "0.33"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.7.0", features = ["util"] }
tracing = "0.1.40"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[patch.crates-io]
hcloud = { git = "https://github.com/pando85/hcloud-rust", branch = "v0.26.0-fix-deprecated" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
debug = false
strip = true
